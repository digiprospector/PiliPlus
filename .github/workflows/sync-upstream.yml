name: Sync Upstream

'on':
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/bggRGjQaUbCoE/PiliPlus.git
          git fetch upstream main

      - name: Merge upstream main
        run: |
          git checkout main
          git merge --no-edit upstream/main

      - name: Push merged branch
        run: |
          git push origin main

      - name: Mirror upstream tags
        run: |
          git fetch upstream --tags
          # 尝试批量同步 Tag，即使个别历史旧 Tag 因包含老旧工作流被安全策略限制，也不阻断同步
          git push origin --tags || echo "部分历史 Tag 受 GitHub 安全策略限制，已跳过"
